<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideal note</title>
<style>
  :root { --canvas:#DAEEFF; --ink:#12355B; --muted:#4a5b6d; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas:#0C1826; --ink:#DAEEFF; --muted:#9fb0c2; }
  }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--canvas); padding:32px;
    font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main { max-width:34rem; }
  h1 { font-size:3rem; line-height:0.96; letter-spacing:-0.02em; color:var(--ink); margin:0 0 16px; }
  p { color:var(--muted); margin:0 0 28px; }
  a { color:var(--ink); font-weight:600; text-decoration:none; margin-right:20px; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>ideal<br>note.</h1>
  <p>for think out loud thinkers</p>
  <nav>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </nav>
</main>
</body>
</html>
